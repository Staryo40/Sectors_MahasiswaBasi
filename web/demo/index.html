<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow radar: data demo</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --panel: #ffffff; --border: #e3e2de; --grid: #ecebe7;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --pos: #2a78d6; --neg: #e34948; --link: #1c5cab;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --panel: #222221; --border: #3a3a37; --grid: #2e2e2c;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #94938a;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --pos: #3987e5; --neg: #e66767; --link: #86b6ef;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header, main, footer { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  header { border-bottom: 1px solid var(--border); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  nav a { margin-right: 14px; }
  a { color: var(--link); }
  .meta, .note, footer { color: var(--text-2); font-size: 13px; }
  .disclaimer { border: 1px solid var(--border); background: var(--panel); padding: 6px 10px; margin-top: 8px; border-radius: 4px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 220px; }
  th { color: var(--text-2); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin: 0 3px 2px 0; font-size: 12px; color: var(--text-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; min-width: 0; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
         padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.15); white-space: nowrap; display: none; }
  .tip b { font-variant-numeric: tabular-nums; }
  .key { display: inline-block; width: 12px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .legend { font-size: 12px; color: var(--text-2); margin: 2px 0 4px; }
  .legend span { margin-right: 12px; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin-top: 4px; }
  button { font: inherit; padding: 3px 10px; }
  .error { color: var(--neg); }
</style>
</head>
<body>
<header>
  <h1>Flow radar: data demo</h1>
  <nav>
    <a href="#daily">Daily shortlist</a>
    <a href="#investor">Weekly / monthly shortlist</a>
    <a href="#briefs">Briefs</a>
  </nav>
  <div class="meta" id="meta"></div>
  <div class="disclaimer" id="disclaimer"></div>
</header>
<main id="app"></main>
<footer>Bare-minimum reference UI: it shows every field the real UI has to carry, with no design. Data is end-of-day.</footer>

<script>
"use strict";
// Where the output files are looked for, in order. ?src=out|fixtures|sample pins one.
const SOURCES = { out: "../../data/out/", fixtures: "../../fixtures/out/", sample: "sample/" };
const pinned = new URLSearchParams(location.search).get("src");
let base = null;

const app = document.getElementById("app");

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function s(tag, attrs, ...children) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const c of children.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}

const compact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
const fmt = {
  num: (v, d = 1) => v == null ? "–" : Number(v).toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d }),
  int: v => v == null ? "–" : Math.round(v).toLocaleString("en"),
  big: v => v == null ? "–" : compact.format(v),
  pct: (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%",
  signed: (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d),
  words: v => String(v ?? "").replace(/_/g, " "),
};
function rankChange(e) {
  if (e.rank_prev == null) return "new";
  const d = e.rank_prev - e.rank;
  return d === 0 ? "=" : (d > 0 ? "▲ " : "▼ ") + Math.abs(d);
}

async function getJSON(name) {
  const res = await fetch(base + name, { cache: "no-store" });
  if (!res.ok) throw new Error(`${base + name}: HTTP ${res.status}`);
  return res.json();
}
async function pickSource() {
  const order = pinned ? [pinned] : ["out", "fixtures", "sample"];
  for (const key of order) {
    if (!SOURCES[key]) continue;
    try { const r = await fetch(SOURCES[key] + "meta.json", { cache: "no-store" }); if (r.ok) { base = SOURCES[key]; return key; } } catch (e) { /* try next */ }
  }
  throw new Error("No output files found. Run `python -m radar export`, or `python web/demo/make_sample.py` for placeholder data.");
}

function table(columns, rows) {
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, columns.map(c => h("th", { class: c.cls || "" }, c.title)))),
    h("tbody", {}, rows.map(r => h("tr", {}, columns.map(c => h("td", { class: c.cls || "" }, c.cell(r))))))));
}
const reasons = e => (e.reasons || []).map(r => h("div", {}, r.text_en));
const flags = e => (e.flags || []).map(f => h("span", { class: "tag" }, fmt.words(f)));
const stockLink = e => h("a", { href: "#stock/" + e.symbol }, e.symbol);

// ---- charts: one y axis each, crosshair + tooltip, table view underneath ----
function chart(title, series, opts = {}) {
  const W = 560, H = 200, m = { t: 10, r: opts.endLabels ? 96 : 12, b: 22, l: 52 };
  const xs = series[0].points.map(p => p.x), n = xs.length;
  const format = opts.format || fmt.big;
  const card = h("div", { class: "card" }, h("h3", {}, title));
  if (!n) { card.append(h("div", { class: "note" }, "No data.")); return card; }

  const values = series.flatMap(q => q.points.map(p => p.y)).filter(v => v != null);
  let lo = Math.min(...values), hi = Math.max(...values);
  if (opts.bars || opts.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.06; if (!opts.bars || lo < 0) lo -= pad; hi += pad;
  if (opts.bars && Math.min(...values) >= 0) lo = 0;
  const step = (W - m.l - m.r) / Math.max(n - (opts.bars ? 0 : 1), 1);
  const X = i => m.l + (opts.bars ? (i + 0.5) * step : i * step);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title });
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)" }),
               s("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-3)" }, format(v)));
  }
  if (lo < 0 && hi > 0) svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "var(--text-3)" }));
  svg.append(s("text", { x: m.l, y: H - 5, "font-size": 11, fill: "var(--text-3)" }, xs[0]),
             s("text", { x: W - m.r, y: H - 5, "text-anchor": "end", "font-size": 11, fill: "var(--text-3)" }, xs[n - 1]));

  if (opts.bars) {
    const w = Math.max(step - 2, 1);
    series[0].points.forEach((p, i) => {
      if (p.y == null) return;
      const y0 = Y(0), y1 = Y(p.y);
      svg.append(s("rect", { x: X(i) - w / 2, y: Math.min(y0, y1), width: w, height: Math.max(Math.abs(y1 - y0), 1), rx: Math.min(2, w / 2),
                             fill: opts.diverging ? (p.y >= 0 ? "var(--pos)" : "var(--neg)") : series[0].color }));
    });
  } else {
    for (const q of series) {
      const d = q.points.map((p, i) => p.y == null ? "" : `${i && q.points[i - 1].y != null ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
      svg.append(s("path", { d, fill: "none", stroke: q.color, "stroke-width": 2, "stroke-linejoin": "round" }));
      const last = q.points[n - 1];
      if (opts.endLabels && last.y != null) svg.append(s("text", { x: X(n - 1) + 6, y: Y(last.y) + 4, "font-size": 11, fill: "var(--text-2)" }, q.name));
    }
  }

  const hair = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--text-3)", "stroke-dasharray": "3 3", visibility: "hidden" });
  svg.append(hair);
  const tip = h("div", { class: "tip" });
  const wrap = h("div", { class: "chart" }, svg, tip);
  const show = i => {
    hair.setAttribute("x1", X(i)); hair.setAttribute("x2", X(i)); hair.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", {}, xs[i]), ...series.map(q => h("div", {},
      h("span", { class: "key", style: `border-color:${opts.diverging ? (q.points[i].y >= 0 ? "var(--pos)" : "var(--neg)") : q.color}` }),
      h("b", {}, format(q.points[i].y)), " ", q.name)));
    tip.style.display = "block";
    const px = X(i) / W * wrap.clientWidth;
    tip.style.left = Math.min(Math.max(px + 10, 0), wrap.clientWidth - tip.offsetWidth - 2) + "px";
    tip.style.top = "8px";
  };
  svg.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect(), x = (ev.clientX - box.left) / box.width * W;
    const i = opts.bars ? Math.floor((x - m.l) / step) : Math.round((x - m.l) / step);
    show(Math.min(Math.max(i, 0), n - 1));
  });
  svg.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); tip.style.display = "none"; });

  if (series.length > 1) card.append(h("div", { class: "legend" }, series.map(q => h("span", {}, h("span", { class: "key", style: `border-color:${q.color}` }), q.name))));
  if (opts.diverging) card.append(h("div", { class: "legend" },
    h("span", {}, h("span", { class: "key", style: "border-color:var(--pos)" }), "net inflow"),
    h("span", {}, h("span", { class: "key", style: "border-color:var(--neg)" }), "net outflow")));
  card.append(wrap, h("details", {}, h("summary", {}, "Table view"),
    table([{ title: "Date", cell: i => xs[i] }, ...series.map(q => ({ title: q.name, cls: "num", cell: i => format(q.points[i].y) }))], xs.map((_, i) => i).reverse())));
  return card;
}
const pts = (rows, key) => rows.map(r => ({ x: r.date, y: r[key] }));

// ---- views ----
async function viewDaily() {
  const data = await getJSON("daily.json");
  let descending = true;
  const body = h("div");
  const draw = () => {
    const rows = [...data].sort((a, b) => descending ? a.rank - b.rank : b.rank - a.rank);
    const keys = data[0] ? data[0].components.map(c => c.key) : [];
    body.replaceChildren(table([
      { title: "Rank", cls: "num", cell: e => e.rank },
      { title: "Change", cell: rankChange },
      { title: "Symbol", cell: stockLink },
      { title: "Name", cell: e => e.name },
      { title: "Flow score", cls: "num", cell: e => fmt.signed(e.flow_score) },
      { title: "Label", cell: e => fmt.words(e.label) },
      { title: "Close", cls: "num", cell: e => fmt.int(e.close) },
      { title: "1-day", cls: "num", cell: e => fmt.pct(e.change_1d, 2) },
      { title: "Reasons", cls: "wrap", cell: reasons },
      { title: "Flags", cell: flags },
      ...keys.map(k => ({ title: fmt.words(k), cls: "num", cell: e => {
        const c = e.components.find(x => x.key === k);
        return c ? `${fmt.signed(c.value, 2)} (${fmt.signed(c.contribution)})` : "–";
      } })),
    ], rows));
  };
  const toggle = h("button", { onclick: () => { descending = !descending; toggle.textContent = label(); draw(); } });
  const label = () => descending ? "Showing strongest accumulation first: switch to strongest distribution" : "Showing strongest distribution first: switch to strongest accumulation";
  toggle.textContent = label();
  draw();
  return [h("h2", {}, "Daily shortlist"),
          h("p", { class: "note" }, "Component cells show the component value (−1 to 1) and, in brackets, its contribution to the score."),
          toggle, body];
}

async function viewInvestor() {
  const data = await getJSON("investor.json");
  return [h("h2", {}, "Weekly / monthly shortlist"), table([
    { title: "Rank", cls: "num", cell: e => e.rank },
    { title: "Change", cell: rankChange },
    { title: "Symbol", cell: stockLink },
    { title: "Name", cell: e => e.name },
    { title: "Investor score", cls: "num", cell: e => fmt.num(e.investor_score) },
    { title: "Quality", cls: "num", cell: e => fmt.num(e.pillars.quality) },
    { title: "Valuation", cls: "num", cell: e => fmt.num(e.pillars.valuation) },
    { title: "Slow flow", cls: "num", cell: e => fmt.num(e.pillars.slow_flow) },
    { title: "Reasons", cls: "wrap", cell: reasons },
    { title: "Coverage", cls: "num", cell: e => e.coverage < 1 ? fmt.pct(e.coverage, 0) : "" },
  ], data)];
}

function brokerTable(rows) {
  return table([
    { title: "Broker", cell: b => `${b.code} ${b.name || ""}` },
    { title: "Cohort", cell: b => b.cohort },
    { title: "Origin", cell: b => b.is_foreign ? "foreign" : "domestic" },
    { title: "Net value (IDR)", cls: "num", cell: b => fmt.big(b.net_value) },
    { title: "Avg price", cls: "num", cell: b => fmt.int(b.avg_price) },
  ], rows || []);
}

async function viewStock(symbol) {
  const d = await getJSON(`stocks/${encodeURIComponent(symbol)}.json`);
  const day = d.daily || {}, inv = d.investor || {}, sr = d.series || {};
  const mix = sr.holder_mix || [];
  return [
    h("h2", {}, `${d.symbol}: ${day.name || inv.name || ""}`),
    h("p", { class: "meta" }, `${day.sector || inv.sector || ""} · last close ${fmt.int(day.close)} · 1-day ${fmt.pct(day.change_1d, 2)} · 10-day ${fmt.pct(day.return_10d, 2)} · volume ${fmt.num(day.volume_ratio, 2)}× its 20-day median`),
    h("div", { class: "grid" },
      h("div", { class: "card" }, h("h3", {}, `Flow score ${fmt.signed(day.flow_score)} (${fmt.words(day.label)}), rank ${day.rank} (${rankChange(day)})`),
        table([{ title: "Component", cell: c => fmt.words(c.key) }, { title: "Value", cls: "num", cell: c => fmt.signed(c.value, 2) },
               { title: "Weight", cls: "num", cell: c => fmt.num(c.weight, 2) }, { title: "Contribution", cls: "num", cell: c => fmt.signed(c.contribution) }], day.components || []),
        h("div", {}, flags(day)), reasons(day)),
      h("div", { class: "card" }, h("h3", {}, `Investor score ${fmt.num(inv.investor_score)}, rank ${inv.rank} (${rankChange(inv)})`),
        h("p", {}, `Quality ${fmt.num(inv.pillars?.quality)} · Valuation ${fmt.num(inv.pillars?.valuation)} · Slow flow ${fmt.num(inv.pillars?.slow_flow)}` + (inv.coverage < 1 ? ` · coverage ${fmt.pct(inv.coverage, 0)}` : "")),
        table([{ title: "Input", cell: c => fmt.words(c.key) }, { title: "Pillar", cell: c => fmt.words(c.pillar) },
               { title: "Raw", cls: "num", cell: c => fmt.num(c.raw, 3) }, { title: "Percentile", cls: "num", cell: c => fmt.pct(c.percentile, 0) }], inv.components || []),
        reasons(inv))),
    h("h2", {}, "Over time"),
    h("div", { class: "grid" },
      chart("Price (close, IDR)", [{ name: "close", color: "var(--series-1)", points: pts(sr.price || [], "close") }], { format: fmt.int }),
      chart("Volume (shares)", [{ name: "volume", color: "var(--series-1)", points: pts(sr.price || [], "volume") }], { bars: true }),
      chart("Foreign flow, daily net (IDR)", [{ name: "net foreign flow", points: pts(sr.foreign_flow || [], "net") }], { bars: true, diverging: true }),
      chart("Foreign flow, cumulative (IDR)", [{ name: "cumulative net", color: "var(--series-1)", points: pts(sr.foreign_flow || [], "cum") }], { zero: true }),
      chart("Flow score", [{ name: "flow score", color: "var(--series-1)", points: pts(sr.flow_score || [], "score") }], { zero: true, format: v => fmt.signed(v) }),
      chart("Holder mix (share of all shares)", [
        { name: "institutional", color: "var(--series-1)", points: pts(mix, "institutional_pct") },
        { name: "individual", color: "var(--series-2)", points: pts(mix, "individual_pct") },
        { name: "foreign", color: "var(--series-3)", points: pts(mix, "foreign_pct") }], { endLabels: true, format: v => fmt.pct(v) })),
    h("h2", {}, `Top brokers by net value (current price ${fmt.int(day.close)})`),
    h("div", { class: "grid" },
      h("div", { class: "card" }, h("h3", {}, "Net buyers"), brokerTable(d.top_brokers?.buyers)),
      h("div", { class: "card" }, h("h3", {}, "Net sellers"), brokerTable(d.top_brokers?.sellers))),
    h("h2", {}, "Insider filings"),
    (d.filings || []).length ? table([{ title: "Date", cell: f => f.date }, { title: "Transaction", cell: f => f.transaction_type }, { title: "Holder type", cell: f => f.holder_type },
      { title: "Holder", cell: f => f.holder_name || "" }, { title: "Value (IDR)", cls: "num", cell: f => f.transaction_value == null ? "" : fmt.big(f.transaction_value) }], d.filings)
      : h("p", { class: "note" }, "None in the last 30 days."),
    h("h2", {}, "Upcoming and recent events"),
    (d.events || []).length ? table([{ title: "Date", cell: e => e.date }, { title: "Type", cell: e => fmt.words(e.type) }, { title: "Detail", cls: "wrap", cell: e => e.detail || "" }], d.events)
      : h("p", { class: "note" }, "None in the window."),
    h("h2", {}, "Fundamentals against peers"),
    table([{ title: "Metric", cell: f => fmt.words(f.key) }, { title: "Value", cls: "num", cell: f => fmt.num(f.value, 3) },
           { title: "Peer average", cls: "num", cell: f => f.peer_avg == null ? "" : fmt.num(f.peer_avg, 3) },
           { title: "Percentile in universe", cls: "num", cell: f => fmt.pct(f.percentile, 0) }], d.fundamentals || []),
  ];
}

function briefBlock(title, brief) {
  return [h("h2", {}, `${title} (as of ${brief.as_of})`),
    table([{ title: "Kind", cell: i => fmt.words(i.kind) }, { title: "Symbol", cell: i => i.symbol ? stockLink(i) : "" }, { title: "What changed", cls: "wrap", cell: i => i.text_en }], brief.items || []),
    (brief.upcoming || []).length ? [h("h3", {}, "Upcoming events"),
      table([{ title: "Date", cell: u => u.date }, { title: "Symbol", cell: stockLink }, { title: "Type", cell: u => fmt.words(u.type) }], brief.upcoming)] : null,
    h("p", { class: "disclaimer" }, brief.disclaimer || "")];
}
async function viewBriefs() {
  const [daily, weekly] = await Promise.all([getJSON("brief_daily.json"), getJSON("brief_weekly.json")]);
  return [...briefBlock("Daily brief", daily), ...briefBlock("Weekly brief", weekly)];
}

async function route() {
  const [name, arg] = (location.hash.slice(1) || "daily").split("/");
  try {
    const view = name === "investor" ? viewInvestor() : name === "briefs" ? viewBriefs() : name === "stock" ? viewStock(arg) : viewDaily();
    app.replaceChildren(...(await view).flat(3).filter(Boolean));
  } catch (err) {
    app.replaceChildren(h("p", { class: "error" }, String(err.message || err)));
  }
  window.scrollTo(0, 0);
}

(async () => {
  try {
    const source = await pickSource();
    const meta = await getJSON("meta.json");
    document.getElementById("meta").textContent =
      `Data as of ${meta.as_of} (end of day) · ${meta.universe}, ${meta.n_stocks} stocks · generated ${meta.generated_at} · source: ${base}` +
      (source !== "out" ? " (not the real pipeline output)" : "");
    document.getElementById("disclaimer").textContent = meta.disclaimer;
    window.addEventListener("hashchange", route);
    route();
  } catch (err) {
    app.replaceChildren(h("p", { class: "error" }, String(err.message || err)));
  }
})();
</script>
</body>
</html>
