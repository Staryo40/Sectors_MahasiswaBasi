<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Radar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#overview">Flow Radar</a>
    <nav id="nav">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#daily" data-view="daily">Daily flow</a>
      <a href="#investor" data-view="investor">Investor list</a>
      <a href="#changes" data-view="changes">What changed</a>
      <a href="#help" data-view="help">How to read this</a>
    </nav>
    <form id="jump" class="jump" autocomplete="off">
      <input id="jump-input" list="symbols" placeholder="Find a stock, e.g. BBCA" aria-label="Find a stock">
      <datalist id="symbols"></datalist>
    </form>
  </div>
  <div class="wrap freshness" id="freshness"></div>
</header>

<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<footer class="wrap foot">
  <p id="disclaimer"></p>
  <p class="muted">Built on end-of-day data from the Sectors Financial API. Scores describe what large investors have been doing; they are not a forecast and not a recommendation.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
